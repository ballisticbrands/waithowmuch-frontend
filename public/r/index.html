<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Get a free report on any Amazon competitor | WaitHowMuch</title>
<meta name="robots" content="noindex" />
<!--
  waithowmuch.com/r/?u=<tag> : the short link to /report/ (the free competitor report), for Reddit DMs and posts.
  Same pattern as /skills/: link previews read the tags below and run no JS, so they show the card and are NOT
  counted. A real visitor runs the script: GA4 records the visit, then the browser goes through
  api.waithowmuch.com/go/report-dm?from=dm-<tag> (or /go/report?from=report-link without ?u=), which saves one
  ReadmeHit row (readme = from, target = report-dm | report) and 302s to /report/ with
  utm_source=reddit&utm_campaign=report&utm_content=<from>, so the signup row carries the same tag.
  Clicks: GET /v1/admin/readme-hits (target report-dm / report).
-->
<meta name="description" content="Paste any Amazon store or product and get its revenue, COGS, ad spend and traffic sources, organic and paid, in one report. Free." />
<meta property="og:site_name" content="WaitHowMuch" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Get a free report on any Amazon competitor" />
<meta property="og:description" content="Revenue, COGS, ad spend and traffic sources (organic and paid) for any Amazon store or product, in one report. Free." />
<meta property="og:url" content="https://waithowmuch.com/report/" />
<meta property="og:image" content="https://waithowmuch.com/logo-512.png" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="Get a free report on any Amazon competitor" />
<meta name="twitter:description" content="Revenue, COGS, ad spend and traffic sources (organic and paid) for any Amazon store or product, in one report. Free." />
<meta name="twitter:image" content="https://waithowmuch.com/logo-512.png" />
<link rel="icon" href="/favicon-32.png" />
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --link: #5b3df5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --link: #a593ff; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; padding: 0 16px; }
  p { margin: 0; text-align: center; } a { color: var(--link); } .m { color: var(--muted); font-size: 14px; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <p>Opening your free WaitHowMuch competitor report…</p>
  <p class="m"><a id="go" href="https://api.waithowmuch.com/go/report?from=report-link">Continue</a></p>
</main>
<script>
(function () {
  var GA4 = "G-0K360RYPPB";
  var raw = "";
  try { raw = new URLSearchParams(location.search).get("u") || ""; } catch (e) {}
  // Same rule as the backend's slug (^[a-z0-9][a-z0-9-]{0,39}$): Reddit's "_" becomes "-".
  var name = raw.toLowerCase().replace(/^u\//, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 37);
  var from = name ? "dm-" + name : "report-link";
  var dest = "https://api.waithowmuch.com/go/" + (name ? "report-dm" : "report") + "?from=" + encodeURIComponent(from);
  document.getElementById("go").href = dest;

  var gone = false;
  function go() { if (!gone) { gone = true; location.replace(dest); } }
  setTimeout(go, 1500); // never hold the visitor longer than this, even if GA is blocked

  window.dataLayer = window.dataLayer || [];
  // gtag.js only reads the arguments OBJECT pushed to dataLayer (see src/main.tsx).
  window.gtag = function () { window.dataLayer.push(arguments); };
  gtag("js", new Date());
  gtag("config", GA4, {
    campaign_source: "reddit", campaign_medium: name ? "dm" : "link", campaign_name: "report",
    campaign_content: from,
  });
  gtag("event", "report_link_click", {
    link_from: from, transport_type: "beacon", event_callback: go, event_timeout: 1200,
  });
  var s = document.createElement("script");
  s.async = true;
  s.src = "https://www.googletagmanager.com/gtag/js?id=" + GA4;
  s.onerror = go;
  document.head.appendChild(s);
})();
</script>
</body>
</html>
