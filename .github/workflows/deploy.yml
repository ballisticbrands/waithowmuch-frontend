name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The prerender reads businesses from the live API, so published content
  # only reaches the static HTML on a build. Rebuild nightly so a profile
  # added through the admin API appears without a code push.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Plain public-registry install. This repo deliberately has NO dependency
      # on @ballisticbrands/frontend-shared, so there is no GitHub Packages
      # registry, no scope and no NODE_AUTH_TOKEN to configure.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          # "Sign in with Google" OAuth Web client ID — public by design
          # (it ships in every brand app's bundle). https://waithowmuch.com is
          # on this client's Authorized JavaScript origins.
          VITE_GOOGLE_CLIENT_ID: "776606808148-8p8l20pg1vt4jcbde2rr1orvlku87b55.apps.googleusercontent.com"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
