<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#5b3df5" />
    <!-- Preload the self-hosted face. Fonts referenced only from CSS are not
         discovered until the stylesheet has parsed; since the stylesheet is
         inlined at build time this is early, and `crossorigin` is REQUIRED
         even same-origin — a font preload without it is fetched twice. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="description" content="Revenue and profit for businesses you have never heard of. Researched from public data." />
    <meta property="og:site_name" content="WaitHowMuch" />
    <meta property="og:image" content="https://waithowmuch.com/logo-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <title>WaitHowMuch</title>
    <!-- GA4 and Clarity are injected at runtime from src/main.tsx. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
